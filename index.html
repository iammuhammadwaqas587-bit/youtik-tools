    <script>
      (function() {
        // Handle Vite HMR WebSocket in development preview environment where HMR is disabled
        if (typeof window !== 'undefined' && window.WebSocket) {
          const NativeWebSocket = window.WebSocket;
          window.WebSocket = function(url, protocols) {
            const urlStr = String(url || '');
            const protoStr = String(protocols || '');
            if (urlStr.includes('vite-hmr') || protoStr.includes('vite-hmr')) {
              const listeners = {};
              const fakeWs = {
                readyState: 1, // WebSocket.OPEN
                CONNECTING: 0,
                OPEN: 1,
                CLOSING: 2,
                CLOSED: 3,
                url: urlStr,
                protocol: 'vite-hmr',
                send: function() {},
                close: function() {},
                addEventListener: function(type, listener) {
                  if (!listeners[type]) listeners[type] = [];
                  listeners[type].push(listener);
                  if (type === 'open') {
                    setTimeout(() => {
                      try { listener({ type: 'open', target: fakeWs }); } catch (e) {}
                    }, 0);
                  }
                },
                removeEventListener: function(type, listener) {
                  if (listeners[type]) {
                    listeners[type] = listeners[type].filter(l => l !== listener);
                  }
                },
                dispatchEvent: function(event) {
                  const type = event && event.type;
                  if (listeners[type]) {
                    listeners[type].forEach(l => {
                      try { l(event); } catch (e) {}
                    });
                  }
                  return true;
                }
              };
              return fakeWs;
            }
            return new NativeWebSocket(url, protocols);
          };
          window.WebSocket.prototype = NativeWebSocket.prototype;
          window.WebSocket.CONNECTING = 0;
          window.WebSocket.OPEN = 1;
          window.WebSocket.CLOSING = 2;
          window.WebSocket.CLOSED = 3;
        }

        // Suppress unhandled WebSocket closed rejections
        window.addEventListener('unhandledrejection', function(event) {
          if (event && event.reason && String(event.reason).includes('WebSocket closed without opened')) {
            event.preventDefault();
          }
        });
      })();
