<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background rounded squircle -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#18181b" />
    </linearGradient>
    <!-- YouTube Red Gradient -->
    <linearGradient id="ytGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF1E27" />
      <stop offset="100%" stop-color="#D90429" />
    </linearGradient>
    <!-- TikTok Cyan & Magenta -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Container Squircle -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" stroke="#27272a" stroke-width="2"/>

  <!-- Left: YouTube Shield / Play Button -->
  <g transform="translate(6, 12)">
    <!-- Red YT Pill -->
    <rect x="0" y="4" width="28" height="32" rx="9" fill="url(#ytGrad)" filter="url(#glow)"/>
    <!-- Play Triangle -->
    <polygon points="10,13 10,27 21,20" fill="#ffffff" />
  </g>

  <!-- Right: TikTok Musical Note merging into the emblem -->
  <g transform="translate(24, 8)">
    <!-- Cyan Shadow / Chromatic Offset -->
    <path d="M22 6.5 C20 4.5 17.5 3 15 2.5 L15 17.5 C14 16.5 12 16 10 16.5 C6.5 17.5 4.5 21 5.5 24.5 C6.5 28 10 30 13.5 29 C16.5 28 18.5 25.5 18.5 22.5 L18.5 10 C21 12 24 13 27 13 L27 8 C25 8 23.5 7.5 22 6.5 Z" 
          fill="#25F4EE" opacity="0.9" transform="translate(-1.5, -0.5)" />

    <!-- Magenta Shadow / Chromatic Offset -->
    <path d="M22 6.5 C20 4.5 17.5 3 15 2.5 L15 17.5 C14 16.5 12 16 10 16.5 C6.5 17.5 4.5 21 5.5 24.5 C6.5 28 10 30 13.5 29 C16.5 28 18.5 25.5 18.5 22.5 L18.5 10 C21 12 24 13 27 13 L27 8 C25 8 23.5 7.5 22 6.5 Z" 
          fill="#FE2C55" opacity="0.9" transform="translate(1.5, 0.5)" />

    <!-- Center Crisp White Note -->
    <path d="M22 6.5 C20 4.5 17.5 3 15 2.5 L15 17.5 C14 16.5 12 16 10 16.5 C6.5 17.5 4.5 21 5.5 24.5 C6.5 28 10 30 13.5 29 C16.5 28 18.5 25.5 18.5 22.5 L18.5 10 C21 12 24 13 27 13 L27 8 C25 8 23.5 7.5 22 6.5 Z" 
          fill="#FFFFFF" />
  </g>
</svg>
